<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MR ANAS — ICT × SMC Trading</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#050505;color:#f5f1e8;font-family:Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;background:
radial-gradient(circle at 50% 0%,rgba(212,175,55,.16),transparent 35%),
linear-gradient(115deg,transparent 45%,rgba(212,175,55,.035) 46%,transparent 47%);pointer-events:none}
.wrap{max-width:1050px;margin:auto;padding:22px}
header{display:flex;align-items:center;gap:14px;padding:8px 0 28px}
.logo{width:58px;height:58px;object-fit:contain;border-radius:50%;border:1px solid #b88a22}
.brand{font-weight:900;letter-spacing:3px;font-size:20px}
.gold{color:#d8ad3f}
.hero{min-height:500px;display:grid;place-items:center;text-align:center;padding:35px 10px;position:relative;overflow:hidden;border:1px solid #211c10;border-radius:28px;background:linear-gradient(180deg,rgba(18,15,8,.82),rgba(5,5,5,.96))}
.chart{position:absolute;inset:0;opacity:.18;background-image:
linear-gradient(#d8ad3f22 1px,transparent 1px),linear-gradient(90deg,#d8ad3f22 1px,transparent 1px);
background-size:48px 48px;mask-image:linear-gradient(to bottom,black,transparent)}
.hero h1{font-size:clamp(42px,9vw,88px);margin:10px 0;letter-spacing:2px}
.hero p{max-width:680px;margin:16px auto;color:#bcb6a8;font-size:18px;line-height:1.6}
.badge{display:inline-block;padding:8px 14px;border:1px solid #7c5d1e;border-radius:999px;color:#e2bc58;font-size:12px;letter-spacing:2px}
section{padding:55px 0}
.title{text-align:center;font-size:34px;margin-bottom:28px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{padding:25px;border:1px solid #302713;border-radius:20px;background:linear-gradient(160deg,#11100c,#080808);box-shadow:0 12px 40px #000}
.card.featured{border-color:#b88a22;transform:translateY(-5px)}
.price{font-size:42px;font-weight:900;color:#e1b84f}
.card h3{margin:8px 0 10px;font-size:20px}
.card p,.card li{color:#aaa394;line-height:1.55}
.card ul{padding-left:19px}
.pay{display:block;margin-top:18px;padding:12px 14px;border-radius:12px;background:#d8ad3f;color:#080808;font-weight:900;text-align:center;text-decoration:none;cursor:pointer}
.payment{max-width:520px;margin:auto;text-align:center;padding:28px;border:1px solid #3b2d12;border-radius:24px;background:#0c0b09}
.qr{width:min(330px,80vw);background:white;padding:12px;border-radius:18px}
.upi{margin:16px 0;padding:14px;border:1px dashed #806222;border-radius:12px;color:#e1b84f;word-break:break-all}
.note{color:#8e897e;font-size:13px;line-height:1.5}
footer{text-align:center;padding:30px;color:#777;font-size:12px}
@media(max-width:760px){.cards{grid-template-columns:1fr}.card.featured{transform:none}}
</style>

<style>
.upi-options{margin-top:16px}.upi-label{font-size:12px;font-weight:800;letter-spacing:.5px;margin-bottom:8px}.upi-apps{display:flex;gap:7px;margin-top:8px}.upi-apps a{flex:1;text-align:center;padding:9px 4px;border:1px solid #ddd;border-radius:9px;text-decoration:none;font-size:12px;font-weight:700;color:inherit}.pay{display:block;text-align:center;text-decoration:none;cursor:pointer}</style>
<style>.paybox{margin-top:12px}.app-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.app-row button{border:1px solid rgba(212,175,55,.45);background:transparent;color:inherit;border-radius:8px;padding:9px 3px;font-weight:700;font-size:11px;cursor:pointer}.app-row button:active{transform:scale(.98)}</style></head>
